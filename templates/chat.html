<!DOCTYPE html>
<html><head><title>PocketSmart AI Chat</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container mt-5"><h1>💬 PocketSmart AI</h1><p>Ask anything about budgeting and expense planning.</p>
<form method="POST"><div class="input-group"><input type="text" name="question" class="form-control" placeholder="Example: How can I control my monthly expenses?" required>
<button class="btn btn-primary" type="submit">Ask AI</button></div></form>
{% if answer %}<div class="card shadow mt-4"><div class="card-body"><h4>🤖 AI Response</h4><p style="white-space: pre-line;">{{ answer }}</p></div></div>{% endif %}
</div></body></html>
