<!DOCTYPE html>
<html><head><title>Expenses</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body><div class="container mt-5"><h1>💸 Expense Tracker</h1>
<form method="POST" class="card p-4 shadow">
<div class="mb-3"><label>Category</label><select name="category" class="form-control" required>
<option>Food</option><option>Travel</option><option>Shopping</option><option>Education</option><option>Bills</option><option>Entertainment</option><option>Other</option></select></div>
<div class="mb-3"><label>Description</label><input type="text" name="description" class="form-control" placeholder="Example: Lunch"></div>
<div class="mb-3"><label>Amount</label><input type="number" name="amount" step="0.01" class="form-control" required></div>
<button class="btn btn-primary" type="submit">Add Expense</button></form>
<hr class="mt-5"><h3>Expense History</h3>
<table class="table table-bordered"><thead><tr><th>Category</th><th>Description</th><th>Amount</th><th>Date</th></tr></thead><tbody>
{% for expense in expenses %}<tr><td>{{ expense.category }}</td><td>{{ expense.description }}</td><td>₹{{ expense.amount }}</td><td>{{ expense.date }}</td></tr>{% endfor %}
</tbody></table></div></body></html>
