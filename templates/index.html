<!DOCTYPE html>
<html><head><title>PocketSmart AI</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav class="navbar navbar-dark bg-dark"><div class="container"><span class="navbar-brand">PocketSmart AI</span></div></nav>
<div class="container mt-5"><div class="text-center"><h1>💰 PocketSmart AI</h1><p class="lead">Your Smart Budget & Recommendation Assistant</p></div>
<div class="card shadow mt-4"><div class="card-body"><h3>Enter Your Monthly Details</h3>
<form action="/dashboard" method="GET">
<div class="mb-3"><label>Monthly Income</label><input type="number" name="income" class="form-control" placeholder="Example: 30000" required></div>
<div class="mb-3"><label>Monthly Savings Goal</label><input type="number" name="savings" class="form-control" placeholder="Example: 5000" required></div>
<button class="btn btn-primary w-100" type="submit">Create My Budget</button>
</form></div></div></div></body></html>
