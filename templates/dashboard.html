<!DOCTYPE html>
<html><head><title>PocketSmart Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head>
<body><div class="container mt-4"><h1>📊 PocketSmart Dashboard</h1><hr>
<div class="row">
<div class="col-md-4"><div class="card shadow p-3"><h5>Income</h5><h2>₹{{ income }}</h2></div></div>
<div class="col-md-4"><div class="card shadow p-3"><h5>Total Expenses</h5><h2>₹{{ total_expenses }}</h2></div></div>
<div class="col-md-4"><div class="card shadow p-3"><h5>Remaining</h5><h2>₹{{ remaining }}</h2></div></div>
</div>
<div class="mt-5"><h3>Expense Breakdown</h3><canvas id="expenseChart"></canvas></div>
<div class="mt-4">
<a href="/expenses" class="btn btn-primary">Add Expenses</a>
<a href="/recommendations?income={{ income }}&savings={{ savings_goal }}" class="btn btn-success">🤖 AI Recommendations</a>
<a href="/chat" class="btn btn-dark">💬 AI Assistant</a>
</div></div>
<script>
const categories = [{% for item in category_data %}"{{ item.category }}",{% endfor %}];
const totals = [{% for item in category_data %}{{ item.total }},{% endfor %}];
new Chart(document.getElementById("expenseChart"), {
 type: "doughnut", data: {labels: categories, datasets: [{data: totals}]}
});
</script></body></html>
